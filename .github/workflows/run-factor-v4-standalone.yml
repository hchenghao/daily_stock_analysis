      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ runner.temp }}/factor-v4/requirements-v4.txt

      - name: Restore BaoStock cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/factor-v4/cache/baostock
          key: baostock-v4-${{ inputs.start_date }}-${{ inputs.end_date }}-standalone-v2
          restore-keys: |
            baostock-v4-${{ inputs.start_date }}-${{ inputs.end_date }}-
            baostock-v4-

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/factor-v4
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v4.txt
          python -m pip install -e .

      - name: Run unit tests
        working-directory: ${{ runner.temp }}/factor-v4
        run: python -m pytest

      - name: Download and verify original Release dataset
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/factor-v4
        run: |
          mkdir -p data
          gh release download "${{ env.DATASET_RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ env.DATASET_FILE }}" \
            --dir data \
            --clobber
          echo "${{ env.DATASET_SHA256 }}  data/${{ env.DATASET_FILE }}" | sha256sum --check -

      - name: Repair data and run strict validation
        working-directory: ${{ runner.temp }}/factor-v4
        run: |
          python run_pipeline.py \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --original "data/${{ env.DATASET_FILE }}" \
            --output outputs/v4

      - name: Build curated result bundle
        working-directory: ${{ runner.temp }}/factor-v4
        run: |
          python - <<'PY2'
          from pathlib import Path
          import zipfile
          root = Path('outputs/v4')
          include = []
          for pattern in ('*.csv', '*.json', '*.md', '*.html', '*.ipynb', '*.png'):
              include.extend(root.glob(pattern))
          out = root / 'A股主板因子v4_结果包.zip'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(set(include)):
                  zf.write(path, path.name)
          print(out, out.stat().st_size)
          PY2

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: astock-factor-v4-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/factor-v4/outputs/v4/A股主板因子v4_结果包.zip
            ${{ runner.temp }}/factor-v4/outputs/v4/A股主板因子v4_严格验证报告.html
            ${{ runner.temp }}/factor-v4/outputs/v4/A股主板因子v4_严格验证报告.md
            ${{ runner.temp }}/factor-v4/outputs/v4/A股主板因子v4_可复现结果.ipynb
            ${{ runner.temp }}/factor-v4/outputs/v4/repaired_mainboard_panel.parquet
          retention-days: 90

      - name: Publish validation Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: factor-v4-${{ github.run_id }}
        working-directory: ${{ runner.temp }}/factor-v4
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            outputs/v4/A股主板因子v4_结果包.zip \
            outputs/v4/A股主板因子v4_严格验证报告.html \
            outputs/v4/A股主板因子v4_严格验证报告.md \
            outputs/v4/A股主板因子v4_可复现结果.ipynb \
            outputs/v4/repaired_mainboard_panel.parquet \
            --title "A股主板因子 v4 严格样本外验证 #${{ github.run_number }}" \
            --notes-file outputs/v4/A股主板因子v4_严格验证报告.md
